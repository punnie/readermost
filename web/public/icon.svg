<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Readermost">
  <rect width="512" height="512" rx="96" fill="#1a5fb4"/>
  <!-- Three stacked lines: a reading list, with the topmost unread. -->
  <g fill="#ffffff">
    <rect x="128" y="144" width="256" height="34" rx="17"/>
    <rect x="128" y="222" width="190" height="34" rx="17" opacity="0.72"/>
    <rect x="128" y="300" width="224" height="34" rx="17" opacity="0.52"/>
  </g>
  <!-- The shared dot: this reader is a conversation. -->
  <circle cx="360" cy="360" r="46" fill="#f6d32d"/>
</svg>
